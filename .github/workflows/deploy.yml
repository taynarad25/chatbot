name: Deploy Chatbot

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Executar Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Servidor Oracle Cloud: SSH direto, sem Cloudflare Access na frente
          # (diferente do servidor antigo) — a porta 22 já está liberada no
          # Network Security Group da instância.
          ssh -v -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -o TCPKeepAlive=yes \
              ubuntu@163.176.219.211 \
              "cd ~/chatbot && \
              git pull origin main && \
              (docker network create chatbot_shared_network || true) && \
              docker compose -f docker-compose.bot.yml build whatsapp-bot && \
              docker compose -f docker-compose.bot.yml up -d --force-recreate --no-deps whatsapp-bot"