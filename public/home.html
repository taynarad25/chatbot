    <style>
        :root {
            --cor-ciano: #00bcd4;
            --cor-roxo: #7b2cbf;
            --cor-laranja: #ff7d00;
            --cor-magenta: #e01a4f;
            --cor-escuro: #1e1e1e;
            --cor-claro: #f8f9fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--cor-claro);
            color: #333;
            overflow-x: hidden;
        }

        /* Banner Principal (Hero) */
        .banner-curados {
            background-color: var(--cor-escuro);
            min-height: 680px;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 80px 4vw 80px 0;
        }

        .banner-container {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 1600px;
            gap: clamp(40px, 5vw, 90px);
            position: relative;
            z-index: 2;
        }

        /* Logotipo com Efeito Bleed (Cortado na borda esquerda) */
        .logo-wrapper {
            flex-shrink: 0;
            margin-left: -110px; /* Sangrando para fora da lateral esquerda */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .logo-img-anim {
            width: clamp(420px, 34vw, 560px);
            height: clamp(420px, 34vw, 560px);
            object-fit: contain;
            filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.65));
            animation: float 5s ease-in-out infinite;
            user-select: none;
            display: block;
        }

        /* Animações */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-16px); }
        }

        /* Textos do Banner - Escala Imponente e Destaque */
        .banner-text {
            animation: fadeInUp 1s ease-out forwards;
            color: #ffffff;
            text-align: left;
            flex: 1;
            min-width: 0;
        }

        .banner-text h2 {
            font-size: clamp(2.8rem, 3.8vw, 4.6rem);
            font-weight: 400; /* Regular */
            margin-bottom: 12px;
            line-height: 1.15;
            letter-spacing: -0.5px;
        }

        .banner-text h2 .highlight {
            color: var(--cor-magenta);
            font-weight: 600; /* SemiBold */
        }

        .banner-text h3 {
            font-size: clamp(1.5rem, 2.2vw, 2.7rem);
            letter-spacing: clamp(6px, 0.8vw, 12px);
            color: #d1d5db;
            margin-bottom: 14px;
            font-weight: 600; /* SemiBold */
            text-transform: uppercase;
        }

        .banner-text h1 {
            font-size: clamp(5.6rem, 9.2vw, 10.5rem);
            font-weight: 800; /* ExtraBold */
            color: var(--cor-ciano);
            letter-spacing: 3px;
            line-height: 0.92;
            text-shadow: 0 6px 32px rgba(0, 188, 212, 0.35);
        }

        /* Responsividade para Tablet */
        @media (max-width: 1024px) {
            .banner-curados {
                min-height: 620px;
                padding: 60px 30px 60px 0;
            }
            .logo-wrapper {
                margin-left: -80px;
            }
            .logo-img-anim {
                width: 380px;
                height: 380px;
            }
            .banner-text h2 {
                font-size: 2.6rem;
            }
            .banner-text h3 {
                font-size: 1.5rem;
                letter-spacing: 5px;
            }
            .banner-text h1 {
                font-size: 6rem;
            }
        }

        /* Responsividade para Celular e Telas Menores */
        @media (max-width: 768px) {
            .banner-curados {
                min-height: auto;
                padding: 65px 20px 75px;
                justify-content: center;
            }
            .banner-container {
                flex-direction: column;
                text-align: center;
                gap: 28px;
                margin: 0 auto;
                justify-content: center;
            }
            .logo-wrapper {
                margin-left: 0;
                display: flex;
                justify-content: center;
            }
            .logo-img-anim {
                width: clamp(220px, 48vw, 280px);
                height: clamp(220px, 48vw, 280px);
                filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.5));
            }
            .banner-text {
                text-align: center;
            }
            .banner-text h2 {
                font-size: clamp(2.1rem, 6vw, 2.7rem);
                margin-bottom: 8px;
            }
            .banner-text h3 {
                font-size: clamp(1.25rem, 3.6vw, 1.6rem);
                letter-spacing: clamp(4px, 1.2vw, 7px);
                margin-bottom: 10px;
            }
            .banner-text h1 {
                font-size: clamp(4.4rem, 13vw, 5.8rem);
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <!-- Seção do Banner Inicial -->
    <section class="banner-curados">
        <div class="banner-container">
            <!-- Logotipo oficial posicionado na borda com efeito bleed -->
            <div class="logo-wrapper">
                <img src="logo.png" alt="Logotipo Comunidade Cristã Curados" class="logo-img-anim">
            </div>

            <!-- Textos estilizados em escala imponente -->
            <div class="banner-text">
                <h2>Seja <span class="highlight">bem-vindo</span> à</h2>
                <h3>COMUNIDADE CRISTÃ</h3>
                <h1>CURADOS</h1>
            </div>
        </div>
    </section>

</body>
